instruction: |
  Create a new Linux group named 'devteam'.  
  Create two users: 'aubrey' and 'margarette'.  
  Add both users to the 'devteam' group as **supplementary members**.  
  Create a directory '/shared/dev' that belongs to the 'devteam' group.  
  Configure it so that:
  - Members of the 'devteam' group can read, write, and execute files inside it.
  - New files created inside '/shared/dev' automatically inherit the 'devteam' group ownership (setgid).
  Finally, verify that both 'aubrey' and 'margarette' can create and edit files in '/shared/dev'.
  - Ensure that files created by users are readable immediately after creation.

